name: daily

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

# Two runs must never overlap, and a run in progress is never cancelled.
concurrency:
  group: daily
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  daily:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Daily forecasts (failure is deferred to the last step)
        id: daily
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: |
          set +e
          python -m ftracker.cli daily
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
      - name: Build site and scoreboard
        run: python -m ftracker.cli site
      - name: Record base commit
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Commit data and results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data results
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "data: daily run ${GITHUB_RUN_ID}"
          fi
      # Pushes made with the built-in token do not trigger other workflows, so
      # ci.yml never sees this commit. Check it here, before it is published.
      - name: Immutability check on the new commit
        run: python -m ftracker.immutability --base ${{ steps.base.outputs.sha }}
      - name: Push data commit
        run: git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@v4
      - name: Fail the job if the daily run failed
        if: ${{ always() }}
        run: |
          if [ "${{ steps.daily.outputs.exit_code }}" != "0" ]; then
            echo "The daily command failed (exit code ${{ steps.daily.outputs.exit_code }}); see its step log."
            exit 1
          fi
