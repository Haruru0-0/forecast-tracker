name: daily

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

# Two runs must never overlap, and a run in progress is never cancelled.
concurrency:
  group: daily
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  daily:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Daily forecasts (failure is deferred to the last step)
        id: daily
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: |
          set +e
          python -m ftracker.cli daily
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
      # The forecast record is the product: commit and push data before anything
      # that can fail. Pushes made with the built-in token do not trigger other
      # workflows, so the script runs the immutability check itself.
      - name: Commit and push data
        run: |
          bash scripts/commit_and_push.sh "data: daily run ${GITHUB_RUN_ID}" data
      - name: Build site and scoreboard (failure is deferred to the last step)
        id: site
        run: |
          set +e
          python -m ftracker.cli site
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
      - name: Refresh the README results block, commit and push results
        run: |
          if [ "${{ steps.site.outputs.exit_code }}" = "0" ]; then
            python scripts/render_readme.py
            bash scripts/commit_and_push.sh "results: daily run ${GITHUB_RUN_ID}" results README.md
          fi
      - uses: actions/upload-pages-artifact@v3
        if: steps.site.outputs.exit_code == '0'
        with:
          path: site
      - name: Deploy to Pages
        id: deploy
        if: steps.site.outputs.exit_code == '0'
        uses: actions/deploy-pages@v4
      - name: Fail the job if the daily run or the site build failed
        if: ${{ !cancelled() }}
        run: |
          if [ "${{ steps.daily.outputs.exit_code }}" != "0" ] || [ "${{ steps.site.outputs.exit_code }}" != "0" ]; then
            echo "Failed: daily exit code ${{ steps.daily.outputs.exit_code }}, site exit code ${{ steps.site.outputs.exit_code }}; see those step logs."
            exit 1
          fi
