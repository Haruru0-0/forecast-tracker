name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Immutability check (push)
        if: github.event_name == 'push'
        run: python -m ftracker.immutability --base ${{ github.event.before }}
      - name: Immutability check (pull request)
        if: github.event_name == 'pull_request'
        run: python -m ftracker.immutability --base ${{ github.event.pull_request.base.sha }}
      - name: Test
        run: pytest
